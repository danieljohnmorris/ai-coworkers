name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test with coverage
        run: npm run test:cov

  # npm below 11 does not understand the `libc` field, so it drops the glibc
  # and musl gating from optional dependencies on any `npm install`. `npm ci`
  # never rewrites the lockfile, so CI would stay green while the committed
  # lockfile silently lost the gating that picks the right binary on Alpine.
  # Regenerate and diff to catch it at review time. See AIC-114.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Pin npm to the version in package.json
        run: |
          want=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm i -g "npm@${want}"
          npm --version
      - name: Regenerate the lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Fail if the committed lockfile differs
        run: |
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of date, or was written by an npm that strips libc fields. Install the npm version in package.json#packageManager and re-run npm install."
            exit 1
          fi
